<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="description" content="DevTinder — Discover developers. Build connections. Create together. The matchmaking and real-time collaboration platform engineered for developers." />

    <!-- Apple PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DevTinder" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / SEO -->
    <meta property="og:title" content="DevTinder — Developer Networking & Collaboration Platform" />
    <meta property="og:description" content="Discover developers, swipe on matching skillsets, chat with real-time code highlighting, and launch collaborative projects." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/devtinder-logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevTinder — Developer Networking & Collaboration" />
    <meta name="twitter:description" content="Discover developers. Build connections. Create together." />

    <title>DevTinder — Developer Networking & Collaboration Platform</title>
  </head>
  <body class="bg-base-100 text-base-content antialiased selection:bg-violet-500/30 selection:text-violet-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              // Service Worker registered
            })
            .catch(() => {
              // Silent SW fallback
            });
        });
      }
    </script>
  </body>
</html>
